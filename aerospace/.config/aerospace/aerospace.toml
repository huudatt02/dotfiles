config-version = 2

after-startup-command = []

start-at-login = true

auto-reload-config = false

enable-normalization-flatten-containers = true

enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

persistent-workspaces = []

on-mode-changed = []

focus-follows-mouse.enabled = false

key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 8
gaps.inner.vertical = 8
gaps.outer.left = 8
gaps.outer.bottom = 8
gaps.outer.top = 8
gaps.outer.right = 8

on-window-detected = [
    {
        if = 'test %{app-bundle-id} = com.apple.AppStore',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.iCal',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.FaceTime',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.findmy',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.freeform',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.finder',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.mail',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.MobileSMS',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.Music',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.Notes',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.mobilephone',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.podcasts',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.reminders',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.Preview',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.QuickTimePlayerX',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.systempreferences',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.TextEdit',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.VoiceMemos',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.weather',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.usebruno.app',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.TablePro',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.obsproject.obs-studio',
        run = 'layout floating',
    },
]

[mode.main.binding]
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
    alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
    alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
    alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
    alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
    alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
    alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
    alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
    alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'

    alt-shift-enter = 'fullscreen'
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']

[workspace-to-monitor-force-assignment]
    1 = 'main'
    2 = 'main'
    3 = 'main'
    4 = 'main'

    5 = 'secondary'
    6 = 'secondary'
    7 = 'secondary'
    8 = 'secondary'
    9 = 'secondary'
